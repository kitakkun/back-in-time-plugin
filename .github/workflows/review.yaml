name: Review

on: pull_request

jobs:
  review-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          # 21 runs the Gradle daemon: the JetWhale host Gradle plugin is published for JVM 21, and
          # the buildscript classpath is resolved against the daemon's JVM. 17 is installed
          # alongside it because that is what every module's toolchain still targets.
          java-version: |
            17
            21
          distribution: 'adopt'

      - name: Publish to MavenLocal
        run: ./gradlew publishToMavenLocal

      - name: Run tests
        run: ./gradlew iosSimulatorArm64Test iosX64Test jvmTest testDebugUnitTest

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.2

      - name: Install Bundle
        run: |
          gem install bundler
          bundle install

      - name: Run Lint
        run: ./gradlew ktlintCheck

      - name: Run Danger
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec danger
