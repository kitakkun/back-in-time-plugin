on:
  push:
    tags:
      - '*'
jobs:
  publish:
    runs-on: macos-latest
    environment: Publication
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          # 21 runs the Gradle daemon: the JetWhale host Gradle plugin is published for JVM 21, and
          # the buildscript classpath is resolved against the daemon's JVM. 17 is installed
          # alongside it because that is what every module's toolchain still targets.
          java-version: |
            17
            21
          distribution: 'adopt'
      - name: publish to MavenCentral
        run: ./gradlew publishAllPublicationsToMavenCentralRepository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{secrets.MAVEN_CENTRAL_USERNAME}}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{secrets.MAVEN_CENTRAL_PASSWORD}}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{secrets.GPG_KEY}}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{secrets.GPG_KEY_PASSWORD}}
          KOTLIN_VERSION: ${{matrix.kotlin}}
